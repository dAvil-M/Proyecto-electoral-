<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A2A43">
  <meta name="description" content="Bienvenida a la Guía Electoral de Colombia. Consulta de resultados electorales para uso estratégico en marketing político.">
  <title>Guía Electoral de Colombia | Bienvenida</title>
  <link rel="stylesheet" href="tokens.css">
</head>
<body class="pagina-bienvenida">

  <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

  <p class="copyright-vertical">Todos los derechos de autor reservados</p>

  <div class="contenedor-principal">

    <p class="marca-datos-banner">Datos de ejemplo - no oficiales</p>

    <main id="contenido" class="bienvenida">

      <header class="bienvenida__cabecera">
        <p class="republica">República de Colombia</p>

        <div class="escudo-ribbon">
          <span class="escudo-circulo">
            <img src="assets/escudo_colombia.png" alt="Escudo de Colombia" width="330" height="336">
          </span>
          <svg class="bandera-cinta" viewBox="0 0 60 110" role="img" aria-label="Cinta con los colores de la bandera de Colombia" focusable="false">
            <path d="M10 0h40v52H10z" fill="#FFEB3B"></path>
            <path d="M10 52h40v29H10z" fill="#003893"></path>
            <path d="M10 81h40v29L30 96 10 110z" fill="#CE1126"></path>
            <path d="M10 0h40v110l-20-14-20 14z" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"></path>
          </svg>
        </div>

        <a class="logo-ge logo-ge--grande bienvenida__logo" href="bienvenida.html" aria-label="Guía Electoral de Colombia, inicio">
          <span class="logo-ge__monograma" aria-hidden="true">GE<span class="logo-ge__punto"></span></span>
          <span class="logo-ge__texto">Guía<br>Electoral de<br>Colombia <span aria-hidden="true">©</span></span>
        </a>
      </header>

      <div class="bienvenida__tarjeta">

        <figure class="bienvenida__hero">
          <img src="assets/casa_narino.jpg"
               alt="Vista de la Casa de Nariño, sede del Gobierno de Colombia, con la bandera de Colombia en el patio central"
               width="1280" height="960" loading="eager" decoding="async">
        </figure>

        <section class="bienvenida__bloque" aria-labelledby="titulo-bienvenida">
          <p class="bienvenida__lema">¡Para estrategias... Documéntese!</p>

          <div class="bienvenida__acciones">
            <h1 class="bienvenida__titulo" id="titulo-bienvenida">Bienvenidos</h1>

            <a class="btn btn--cian btn--ingresar" href="menú.html" aria-label="Ingresar al menú de resultados electorales">
              Ingresar
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
              </svg>
            </a>
          </div>
        </section>

      </div>

    </main>

    <footer class="footer-app">
      <p class="footer-app__marca">© 2026 · Guía Electoral de Colombia</p>
      <p class="marca-datos-banner">Datos de ejemplo - no oficiales</p>
    </footer>

  </div>

</body>
</html>
